[workspace]
resolver = "2"
members = ["crates/*"]
# Educational Maturin package (needs a local Python; not part of default CI).
# Desktop Python mods: `room-app --features python-mods` (enables room-python-host/embed).
exclude = ["python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"
repository = "https://github.com/room-engine/room"
description = "Pure-Rust re-implementation of the ZDoom/GZDoom engine family"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
float_arithmetic = "allow"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "query",
    "ws",
] }
bitflags = "2.9"
bytemuck = { version = "1.22", features = ["derive"] }
bytes = "1.10"
dashmap = "6.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
getrandom = "0.3"
serde_json = "1.0"
tokio = { version = "1.44", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
    "io-util",
] }
tokio-tungstenite = { version = "0.26", default-features = false, features = [
    "connect",
    "handshake",
] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glam = "0.30"
claxon = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
cpal = "0.15"
lewton = "0.10"
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
indexmap = "2.9"
image = { version = "0.25", default-features = false, features = ["png"] }
image-compare = "0.4"
insta = { version = "1.43", features = ["yaml"] }
libm = "0.2"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
subtle = "2.6"
argon2 = { version = "0.5", default-features = false, features = ["std", "password-hash", "alloc"] }
password-hash = "0.5"
totp-rs = { version = "5.6", default-features = false, features = ["otpauth"] }
base64 = "0.22"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
ecdsa = { version = "0.16", default-features = false, features = ["signing", "verifying", "der"] }
ciborium = "0.2"
url = "2.5"
zeroize = { version = "1.8", features = ["derive"] }
png = { version = "0.17", default-features = false }
gif = "0.14"
pollster = "0.4"
proptest = "1.6"
proc-macro2 = "1.0"
quote = "1.0"
ron = "0.12"
syn = { version = "2.0", features = ["full"] }
rustysynth = "1.3"
serde = { version = "1.0", features = ["derive"] }
nuked-opl3 = "0.1"
winit = { version = "0.30", default-features = true }
zune-jpeg = "0.4"
sevenz-rust2 = { version = "0.19", default-features = false }
smallvec = "1.15"
# Noise Protocol Framework (pure Rust: curve25519-dalek / ChaChaPoly / BLAKE2 / SHA-2).
snow = { version = "0.10", default-features = true }
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
thiserror = "2.0"
wasmi = "0.40"
wasmparser = { version = "0.224", default-features = false, features = ["std", "validate", "features"] }
wasmtime = { version = "26", default-features = false, features = ["cranelift", "runtime", "std"] }
wat = "1.224"
wgpu = "25"
naga = { version = "25", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# PK3: deflate + pure-Rust bzip2 (`libbz2-rs-sys`) + lzma (`lzma-rust2`). No `cc`.
zip = { version = "8.6", default-features = false, features = ["deflate", "bzip2", "lzma"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
