[package]
name = "room-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Browser shell (wasm-bindgen + web-sys)."

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = { workspace = true, optional = true }
room-audio = { path = "../room-audio", optional = true }
room-build = { path = "../room-build", optional = true }
room-build-engine = { path = "../room-build-engine", optional = true }
room-core = { path = "../room-core", optional = true }
room-defs = { path = "../room-defs", optional = true }
room-faceswap = { path = "../room-faceswap", optional = true }
room-formats = { path = "../room-formats", optional = true }
room-game = { path = "../room-game", optional = true }
room-input = { path = "../room-input", optional = true }
room-map = { path = "../room-map", optional = true }
room-mapgen = { path = "../room-mapgen", optional = true }
room-music = { path = "../room-music", optional = true }
room-net = { path = "../room-net", default-features = false, optional = true }
room-proto = { path = "../room-proto", optional = true }
room-nodebuild = { path = "../room-nodebuild", optional = true }
room-duke = { path = "../room-duke", optional = true }
room-render = { path = "../room-render", optional = true }
room-script = { path = "../room-script", optional = true }
room-zvm = { path = "../room-zvm", optional = true, features = ["aot-web"] }
room-zvm-wasm = { path = "../room-zvm-wasm", optional = true }
room-sim = { path = "../room-sim", optional = true }
room-ui = { path = "../room-ui", optional = true }
room-vfs = { path = "../room-vfs", optional = true }
room-zscript = { path = "../room-zscript", optional = true }
glam = { workspace = true, optional = true }
wat = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "Location",
    "Storage",
    "console",
    "Performance",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "Event",
    "EventTarget",
    "AddEventListenerOptions",
    "AudioContext",
    "AudioContextOptions",
    "AudioContextState",
    "AudioBuffer",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioProcessingEvent",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "BaseAudioContext",
    "Blob",
    "BlobPropertyBag",
    "GainNode",
    "MessageEvent",
    "MessagePort",
    "ScriptProcessorNode",
    "Url",
    "HtmlTextAreaElement",
    "BinaryType",
    "CloseEvent",
    "WebSocket",
    "Response",
] }
console_error_panic_hook = { version = "0.1", optional = true }
# `webgl` is the wasm WebGL2 backend. Default `gles` does not compile it in,
# so a browser with no WebGPU adapter cannot start.
wgpu = { workspace = true, optional = true, features = ["webgl"] }
libm = { workspace = true, optional = true }

[features]
default = []
# Enabled for wasm32 builds / CI.
browser = [
    "dep:bytes",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:js-sys",
    "dep:console_error_panic_hook",
    "dep:room-audio",
    "dep:room-build",
    "dep:room-build-engine",
    "dep:room-core",
    "dep:room-defs",
    "dep:room-faceswap",
    "dep:room-formats",
    "dep:serde_json",
    "dep:room-game",
    "dep:room-input",
    "dep:room-map",
    "dep:room-music",
    "dep:room-net",
    "dep:room-proto",
    "dep:room-nodebuild",
    "dep:room-mapgen",
    "dep:room-duke",
    "dep:room-render",
    "dep:room-script",
    "dep:room-sim",
    "dep:room-zvm",
    "dep:room-zvm-wasm",
    "dep:room-ui",
    "dep:room-vfs",
    "dep:room-zscript",
    "dep:glam",
    "dep:wgpu",
    "dep:libm",
    "dep:wat",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
room-testkit = { path = "../room-testkit" }

[[test]]
name = "browser_smoke"
required-features = ["browser"]
