[package]
name = "ferrite-net"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lockstep netcode and transports."

[lints]
workspace = true

[dependencies]
matchbox_socket = { version = "0.14", optional = true }
snow = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
ferrite-signal = { path = "../ferrite-signal" }

[features]
default = ["noise"]
# Native/web WebRTC via matchbox (pulls crypto; see appendix-a `net-webrtc-native`).
webrtc = ["dep:matchbox_socket"]
# Noise Protocol Framework (pure-Rust snow resolver).
noise = ["dep:snow"]
