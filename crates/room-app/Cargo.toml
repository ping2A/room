[package]
name = "room-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native desktop binary (winit + wgpu + cpal)."

[[bin]]
name = "room"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
## Embed CPython and load `language = "python"` ROOMMOD modules (desktop only).
python-mods = ["room-python-host/embed"]

[dependencies]
clap.workspace = true
cpal.workspace = true
room-audio = { path = "../room-audio" }
room-console = { path = "../room-console" }
room-decorate = { path = "../room-decorate" }
room-build = { path = "../room-build" }
room-defs = { path = "../room-defs" }
room-game = { path = "../room-game" }
room-input = { path = "../room-input" }
room-map = { path = "../room-map" }
room-music = { path = "../room-music" }
room-net = { path = "../room-net", features = ["noise"] }
room-nodebuild = { path = "../room-nodebuild" }
room-render = { path = "../room-render" }
room-sim = { path = "../room-sim" }
room-core = { path = "../room-core" }
room-testkit = { path = "../room-testkit" }
room-ui = { path = "../room-ui" }
room-vfs = { path = "../room-vfs" }
room-faceswap = { path = "../room-faceswap" }
room-python-host = { path = "../room-python-host" }
glam.workspace = true
image.workspace = true
pollster.workspace = true
thiserror.workspace = true
wgpu.workspace = true
winit.workspace = true
