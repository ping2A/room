[package]
name = "ferrite-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native desktop binary (winit + wgpu + cpal)."

[[bin]]
name = "ferrite"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
cpal.workspace = true
ferrite-audio = { path = "../ferrite-audio" }
ferrite-console = { path = "../ferrite-console" }
ferrite-decorate = { path = "../ferrite-decorate" }
ferrite-defs = { path = "../ferrite-defs" }
ferrite-game = { path = "../ferrite-game" }
ferrite-input = { path = "../ferrite-input" }
ferrite-map = { path = "../ferrite-map" }
ferrite-music = { path = "../ferrite-music" }
ferrite-net = { path = "../ferrite-net", features = ["noise"] }
ferrite-nodebuild = { path = "../ferrite-nodebuild" }
ferrite-render = { path = "../ferrite-render" }
ferrite-sim = { path = "../ferrite-sim" }
ferrite-testkit = { path = "../ferrite-testkit" }
ferrite-ui = { path = "../ferrite-ui" }
ferrite-vfs = { path = "../ferrite-vfs" }
glam.workspace = true
pollster.workspace = true
wgpu.workspace = true
winit.workspace = true
