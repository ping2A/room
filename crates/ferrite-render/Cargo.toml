[package]
name = "ferrite-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wgpu renderer: 3D scene plus 2D canvas backend."

[lints]
workspace = true

[build-dependencies]
naga = { workspace = true, features = ["wgsl-in"] }

[dependencies]
bytemuck.workspace = true
naga = { workspace = true, features = ["glsl-in", "wgsl-out"] }
ferrite-core = { path = "../ferrite-core" }
ferrite-defs = { path = "../ferrite-defs" }
ferrite-formats = { path = "../ferrite-formats" }
ferrite-map = { path = "../ferrite-map" }
ferrite-nodebuild = { path = "../ferrite-nodebuild" }
ferrite-vfs = { path = "../ferrite-vfs" }
glam.workspace = true
libm.workspace = true
gif.workspace = true
png.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[dev-dependencies]
ferrite-decorate = { path = "../ferrite-decorate" }
ferrite-sim = { path = "../ferrite-sim" }
ferrite-testkit = { path = "../ferrite-testkit" }
image.workspace = true
image-compare.workspace = true
pollster.workspace = true
