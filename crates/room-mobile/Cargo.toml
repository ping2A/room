[package]
name = "room-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Android and iOS entry points for the Room app (docs/41)."

[lib]
# `cdylib`: the `.so` an Android APK loads. iOS runs the `room-ios` binary
# below (a static library is still possible for embedding in an Xcode
# project: `cargo rustc -p room-mobile --crate-type staticlib`).
crate-type = ["rlib", "cdylib"]

# The iPhone app's executable (docs/41 M5, `scripts/build-ios.sh`).
[[bin]]
name = "room-ios"
path = "src/bin/room_ios.rs"
required-features = ["ios-app"]

[features]
## Build the `room-ios` executable.
ios-app = []

[lints]
workspace = true

[dependencies]
# No `cli` (clap), no `jit` (Cranelift: iOS forbids runtime code generation),
# no `gamepad` (gilrs has no iOS backend; phones get pads from the OS in M7).
room-app = { path = "../room-app", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
# NativeActivity: no Java/AndroidX code, so the APK needs no Gradle build.
winit = { workspace = true, features = ["android-native-activity"] }
# pipe/dup2 to send stdout/stderr to logcat.
libc = "0.2"
