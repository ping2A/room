[package]
name = "ferrite-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Browser shell (wasm-bindgen + web-sys)."

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = { workspace = true, optional = true }
ferrite-audio = { path = "../ferrite-audio", optional = true }
ferrite-defs = { path = "../ferrite-defs", optional = true }
ferrite-game = { path = "../ferrite-game", optional = true }
ferrite-input = { path = "../ferrite-input", optional = true }
ferrite-map = { path = "../ferrite-map", optional = true }
ferrite-music = { path = "../ferrite-music", optional = true }
ferrite-nodebuild = { path = "../ferrite-nodebuild", optional = true }
ferrite-render = { path = "../ferrite-render", optional = true }
ferrite-sim = { path = "../ferrite-sim", optional = true }
ferrite-ui = { path = "../ferrite-ui", optional = true }
ferrite-vfs = { path = "../ferrite-vfs", optional = true }
glam = { workspace = true, optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "Location",
    "Storage",
    "console",
    "Performance",
    "KeyboardEvent",
    "MouseEvent",
    "Event",
    "EventTarget",
    "AddEventListenerOptions",
    "AudioContext",
    "AudioContextOptions",
    "AudioBuffer",
    "AudioDestinationNode",
    "AudioNode",
    "AudioProcessingEvent",
    "BaseAudioContext",
    "ScriptProcessorNode",
] }
console_error_panic_hook = { version = "0.1", optional = true }
wgpu = { workspace = true, optional = true }
libm = { workspace = true, optional = true }

[features]
default = []
# Enabled for wasm32 builds / CI.
browser = [
    "dep:bytes",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:js-sys",
    "dep:console_error_panic_hook",
    "dep:ferrite-audio",
    "dep:ferrite-defs",
    "dep:ferrite-game",
    "dep:ferrite-input",
    "dep:ferrite-map",
    "dep:ferrite-music",
    "dep:ferrite-nodebuild",
    "dep:ferrite-render",
    "dep:ferrite-sim",
    "dep:ferrite-ui",
    "dep:ferrite-vfs",
    "dep:glam",
    "dep:wgpu",
    "dep:libm",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[[test]]
name = "browser_smoke"
required-features = ["browser"]
