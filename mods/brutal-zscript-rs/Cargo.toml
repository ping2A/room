[package]
name = "room-mod-brutal-zscript"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Brutal Doom's ZScript (ZandroCompat, Script_DamageMult, Damage_Control) hand-ported to a Room Rust WASM mod."
publish = false

# Standalone guest crate (built for wasm32-unknown-unknown), not a workspace member.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
room-script-sdk = { path = "../../crates/room-script-sdk" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
